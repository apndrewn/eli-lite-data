          if (dataRows.length) groups.push({ title: "Data Libraries", rows: dataRows.slice().sort(_byLabel) });
          return groups;
        }

        var parts = [];

        bundleOrder.forEach(function (bid) {
          if (!bundleBuckets[bid] || !bundleBuckets[bid].length) return;
          var b = bundleMeta[bid];
          parts.push(_renderSection({
            key: "bundle:" + bid,
            cls: "_eli3_dl_section_bundle",
            icon: b.icon || "📦",
            title: b.label || bid,
            subtitle: b.description || "",
            groups: _groupBundleRows(bundleBuckets[bid]),
            collapsed: true,
          }));
        });

        Object.keys(toolByCategory).sort().forEach(function (cat) {
          parts.push(_renderSection({
            key: "cat:" + cat,
            icon: "🛠️",
            title: cat,
            rows: toolByCategory[cat],
            collapsed: true,
          }));
        });

        if (dataUnbundled.length) {
          parts.push(_renderSection({
            key: "data",
            icon: "📚",
            title: "Data Libraries",
            rows: dataUnbundled,
            collapsed: true,
          }));
        }

        var html = parts.join("") || '<div style="padding:14px; color:#64748b;">Nothing to install or update.</div>';

        var n = updates.length;
        var banner =
          '<div class="_eli3_dl_banner">' +
          '<div class="_eli3_dl_banner_icon">🔔</div>' +
          '<div class="_eli3_dl_banner_text">' +
          '<div class="_eli3_dl_banner_title">You have updates</div>' +
          '<div class="_eli3_dl_banner_sub">' +
          n + ' new ' + (n === 1 ? 'release is' : 'releases are') +
          ' ready to install.' +
          '</div>' +
          '</div>' +
          '<div class="_eli3_dl_banner_count">' + n + '</div>' +
          '</div>';

        showEliDialog({
          variant: "info",
          tier: "premium",
          dialogClass: "_eli3_dialog_wide _eli3_dialog_downloads",
          title: title,
          body: banner + html,
          primary: {
            label: "⬇️ Install selected",
            onclick: function (e, overlay) {
              var ids = [];
              overlay.querySelectorAll('input[data-eli-upd-id]:checked').forEach(function (cb) {
                ids.push(cb.getAttribute("data-eli-upd-id"));
              });
              if (!ids.length) { showToast("Nothing selected.", "warn"); return false; }
              var subset = updates.filter(function (u) {
                var id = (u.entry && u.entry.id) || (u.remote && u.remote.id) || "";
                return ids.indexOf(id) !== -1;
