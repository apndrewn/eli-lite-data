        };
        var zoomIn = document.createElement("button");
        zoomIn.className = "_eli3_status_btn _eli3_status_zoom_btn";
        zoomIn.title = "Zoom in";
        zoomIn.textContent = "+";
        zoomIn.onclick = function () { _stepZoom(10); };
        zoomGroup.appendChild(zoomOut);
        zoomGroup.appendChild(zoomLabel);
        zoomGroup.appendChild(zoomIn);
        bar.appendChild(zoomGroup);

        _paintFooterSlots(bar, "right");
      }

      function _currentZoom() {
        try {
          var raw = window.eli.compat && window.eli.compat.lsGet("_eli3_zoom");
          var n = parseFloat(raw);
          if (isFinite(n) && n >= 0.7 && n <= 1.3) return n;
        } catch (e) { }
        try {
          if (typeof window.screen !== "undefined" && window.screen.height <= 900) {
            return 0.7;
          }
        } catch (e) { }
        return 1.0;
      }
      function _autoZoomDefault() {
        try {
          if (typeof window.screen !== "undefined" && window.screen.height <= 900) return 0.7;
        } catch (e) { }
        return 1.0;
      }
      function _setZoom(n) {
        n = Math.round(n * 100) / 100;
        if (n < 0.7) n = 0.7;
        if (n > 1.3) n = 1.3;
        var root = document.getElementById(ROOT_ID);
        if (root) {
          if ("zoom" in document.body.style) {
