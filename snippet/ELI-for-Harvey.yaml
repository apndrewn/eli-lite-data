                g.rows.map(_row).join("") +
                '</div>';
            }).join("")
            : rows.map(_row).join("");
          return '<div class="_eli3_dl_section ' + (opts.cls || "") + '" data-eli-dl-section="' + _esc(key) + '">' +
            '<button type="button" class="_eli3_dl_section_head" data-eli-dl-toggle="' + _esc(key) + '">' +
            '<span class="_eli3_dl_section_chevron">' + chev + '</span>' +
            '<span class="_eli3_dl_section_icon">' + _esc(opts.icon || "") + '</span>' +
            '<span class="_eli3_dl_section_title">' + _esc(opts.title) + '</span>' +
            '<span class="_eli3_dl_count">' + totalCount + '</span>' +
            _selectAllBtn(key) +
            '</button>' +
            '<div class="_eli3_dl_section_body"' + bodyStyle + '>' +
            (opts.subtitle ? '<div class="_eli3_dl_section_sub">' + _esc(opts.subtitle) + '</div>' : "") +
            '<div class="_eli3_dl_list">' + listHtml + '</div>' +
            '</div>' +
            '</div>';
        }

        function _groupBundleRows(bundleRows) {
          var toolsByCat = {};
          var dataRows = [];
          bundleRows.forEach(function (u) {
            var entry = u.entry || u.remote || {};
            if (entry.kind === "data") { dataRows.push(u); return; }
            var cat = (entry.catalog && entry.catalog.category) ||
              (entry.category) ||
              "Other";
            if (!toolsByCat[cat]) toolsByCat[cat] = [];
            toolsByCat[cat].push(u);
          });
          function _labelOf(u) {
            var e = u.entry || u.remote || {};
            return String(e.label || e.id || "");
          }
          function _byLabel(a, b) { return _labelOf(a).localeCompare(_labelOf(b)); }
          var groups = [];
