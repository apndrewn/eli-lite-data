      function _getVisibleTools() {
        var loaded = window.eli.tools && window.eli.tools._loaded ? window.eli.tools._loaded : {};
        var ident = window.eli.tools && window.eli.tools.userIdentity ? window.eli.tools.userIdentity() : null;
