        var bundleBuckets = {};
        var toolByCategory = {};
        var dataUnbundled = [];

        function _categoryOf(entry) {
          if (!entry) return "Other";
          if (entry.catalog && entry.catalog.category) return String(entry.catalog.category);
          if (entry.category) return String(entry.category);
          return "Other";
        }

        updates.forEach(function (u) {
          var entry = u.entry || u.remote || {};
          var bid = bundleByMember[entry.id];
          if (bid) {
