            '</div>' +
            '<div class="_eli3_profile_field">' +
            '<label for="_eli3_ob_group" class="_eli3_profile_label">Group</label>' +
            '<select id="_eli3_ob_group" class="_eli3_profile_input">' + groupOpts + '</select>' +
            '</div>' +
            '</div>' +
            '<div id="_eli3_ob_err" class="_eli3_profile_err" style="display:none"></div>' +
            '</div>';
          showEliDialog({
            variant: "neutral",
            tier: "premium",
            dialogClass: "_eli3_dialog_profile",
            icon: "👋",
            title: "Welcome to ELI",
            body: body,
            closable: false,
            primary: {
              label: "Continue",
              onclick: function (e, ov) {
                var name = (ov.querySelector("#_eli3_ob_name") || {}).value || "";
                var email = (ov.querySelector("#_eli3_ob_email") || {}).value || "";
                var lang = (ov.querySelector("#_eli3_ob_lang") || {}).value || "en";
                var group = (ov.querySelector("#_eli3_ob_group") || {}).value || "External Innovation";
                name = String(name).trim();
                email = String(email).trim();
                var err = ov.querySelector("#_eli3_ob_err");
                var nameParts = name.split(/\s+/).filter(Boolean);
                if (!name || nameParts.length < 2) {
                  if (err) { err.textContent = "Please enter your full name (first and last)."; err.style.display = "block"; }
                  return false;
                }
                if (!email || email.indexOf("@") === -1 || !/\.[a-z]{2,}$/i.test(email)) {
                  if (err) { err.textContent = "Please enter a valid email address."; err.style.display = "block"; }
                  return false;
                }
                var blob = (typeof existing === "object" && existing) ? existing : {};
                blob.userName = name;
                blob.userFirstName = nameParts[0] || name;
                blob.userEmail = email;
                blob.userGroup = group;
                blob.userLanguage = lang;
                if (!blob.audienceTags) blob.audienceTags = [];
                blob.hasOnboarded = true;
                try { window.eli.compat.lsSet("eli_user_settings", JSON.stringify(blob)); } catch (e) { }
                try { window.eli.compat.lsSet("eli_language", lang); } catch (e) { }
                try { if (window.eli.dashboard && window.eli.dashboard.refresh) window.eli.dashboard.refresh(); } catch (e) { }
                resolve({ name: name, email: email, group: group, lang: lang });
              },
            },
          });
        });
      }

      return {
        show: show,
        importToken: importToken,
        importPackage: importPackage,
        maybeFirstRun: maybeFirstRun,
        collectProfile: _collectProfile,
      };
    })());


    function _eliPhase1Banner(message, isError) {
      try {
        var host = document.body || document.documentElement;
        if (!host) return;
        var el = document.createElement("div");
        el.id = "_eli3_boot_banner";
        el.className = "_eli3_boot_banner" + (isError ? " _eli3_boot_banner_error" : "");
        el.textContent = message;
        var prior = document.getElementById("_eli3_boot_banner");
        if (prior && prior.parentNode) prior.parentNode.removeChild(prior);
        host.appendChild(el);
      } catch (e) { }
    }


    function _eliShowKernelUpdateBanner(pending) {
      try {
        if (!pending || !pending.length) return;
        if (window._eli3_kernelBannerDismissed) return;
        var host = document.body;
        if (!host) return;
        var prior = document.getElementById("_eli3_kernel_update_banner");
        if (prior && prior.parentNode) prior.parentNode.removeChild(prior);
        var n = pending.length;
        var el = document.createElement("div");
        el.id = "_eli3_kernel_update_banner";
        el.className = "_eli3_kernel_update_banner";
        el.innerHTML =
          '<span class="_eli3_kub_icon" aria-hidden="true">⬆</span>' +
          '<span class="_eli3_kub_text">' +
          '<strong>' + n + ' tool' + (n === 1 ? '' : 's') + ' need' + (n === 1 ? 's' : '') +
          ' a newer ELI Operating System.</strong> ' +
          'Update ELI via <em>Script Lab → Import</em> to install ' +
          (n === 1 ? 'it' : 'them') + '.' +
          '</span>' +
          '<button type="button" class="_eli3_kub_details" ' +
          'title="See which tools are waiting">Which tools?</button>' +
          '<button type="button" class="_eli3_kub_close" aria-label="Dismiss" ' +
          'title="Hide for this session">×</button>';
        el.querySelector("._eli3_kub_close").onclick = function () {
          window._eli3_kernelBannerDismissed = true;
          if (el.parentNode) el.parentNode.removeChild(el);
        };
        el.querySelector("._eli3_kub_details").onclick = function () {
          if (typeof window.showEliDialog !== "function") return;
          var rows = pending.map(function (p) {
            return '<tr>' +
              '<td style="padding:6px 10px;border-bottom:1px solid #f1f5f9;font-weight:600;color:#0f172a">' +
              String(p.toolLabel).replace(/[<>&]/g, function (c) {
                return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
              }) +
              '</td>' +
              '<td style="padding:6px 10px;border-bottom:1px solid #f1f5f9;color:#64748b;font-size:12px">' +
              'Needs ELI OS v' + p.requiredKernel +
              ' (you have v' + p.runningKernel + ')' +
              '</td>' +
              '</tr>';
          }).join("");
          window.showEliDialog({
            variant: "info",
            icon: "⬆",
            title: "Tools waiting for ELI Operating System update",
            body:
              '<div style="font-size:13px;line-height:1.55;color:#1f2937">' +
              '<p style="margin:0 0 12px">' +
              'These tools were built against a newer ELI Operating System ' +
              'than your current snippet. They\'ll install automatically once ' +
              'you update ELI.' +
              '</p>' +
              '<table style="width:100%;border-collapse:collapse;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden">' +
              rows +
              '</table>' +
              '<p style="margin:14px 0 0;font-size:12px;color:#64748b">' +
              '<strong>How to update:</strong> open Script Lab → Import → paste the latest ELI snippet → Run. ' +
              'Your installed tools and data carry over.' +
              '</p>' +
              '</div>',
            buttons: [{
              label: "Got it",
              cls: "btn-action btn-primary",
              onclick: function (e, ov) { if (ov.parentNode) ov.parentNode.removeChild(ov); },
            }],
          });
        };
        host.appendChild(el);
      } catch (e) { }
    }


    function init() {
      window.eli.perf.mark("boot:office_ready");
      _elog("[ELI v3] kernel booting · " + new Date().toISOString());
      _eliInstallCrashHandlers();
      _eliInjectKernelStyles();
      if (!window.eli || typeof window.eli.register !== "function") {
        _eerror("[ELI v3] registry missing — code order regression");
        _eliPhase1Banner("ELI v3 boot FAILED — registry missing", true);
        return;
      }
      initFeatureDB()
        .then(function (db) {
          window.eli.perf.mark("boot:idb_open");
          var stores = Array.prototype.slice.call(db.objectStoreNames || []);
          _elog("[ELI v3] IDB open · stores: " + stores.length + " · version: " + db.version);
          try {
            if (window.eli.settings && typeof window.eli.settings.hydrateAdminLayers === "function") {
              window.eli.settings.hydrateAdminLayers().then(function (loaded) {
                if (loaded > 0) {
                  window.eli.log.event("boot", "settings_hydrated", { loaded: loaded });
                }
              });
            }
          } catch (_e) { }

          try {
            if (!window.eli.compat.lsGet("eli_lsCleanup_v1")) {
              var _deadLsRe = /^eli_(dataVer|dataReleasedAt|sectionDataId|dataIdSections|storeReleasedAt)_/;
              var _lsKilled = 0;
              for (var _li = localStorage.length - 1; _li >= 0; _li--) {
                var _lk = localStorage.key(_li);
                if (_lk && _deadLsRe.test(_lk)) {
                  try { localStorage.removeItem(_lk); _lsKilled++; } catch (_e) { }
                }
              }
              window.eli.compat.lsSet("eli_lsCleanup_v1", "1");
              window.eli.log.event("boot", "ls_cleanup", { killed: _lsKilled });
            }
          } catch (e) { }
          setTimeout(function () {
            if (window.eli.host && window.eli.host.readText) {
              window.eli.host.readText().catch(function () { });
            }
          }, 800);
          window.eli.ai.loadApiKey().then(function (loaded) {
            _elog("[ELI v3] API key loaded:", loaded);
            try {
              if (window.eli.dashboard && window.eli.dashboard.refresh) {
                window.eli.dashboard.refresh();
              }
            } catch (e) { }
            setTimeout(function () {
              if (window.eli.settings && window.eli.settings.maybeFirstRun) {
                window.eli.settings.maybeFirstRun().catch(function () { });
              }
            }, 600);
          });
          window.eli.tools.loadBootTier().then(function (count) {
            window.eli.perf.mark("boot:tools_ready");
            _elog("[ELI v3] boot-tier tools loaded:", count);
            try { if (window.eli.dashboard && window.eli.dashboard.refresh) window.eli.dashboard.refresh(); }
            catch (e) { }
            try { if (window.eli.bus) window.eli.bus.emit("tools:loaded", { count: count }); }
            catch (e) { _ewarn("[boot] tools:loaded emit failed:", e); }
            try {
              if (typeof window.eli.tools.loadPreloadTier === "function") {
                window.eli.tools.loadPreloadTier().then(function (n) {
                  window.eli.perf.mark("boot:preload_ready");
                  window.eli.log.event("tools", "preload_loaded", { count: n });
                  try { if (window.eli.dashboard && window.eli.dashboard.refresh) window.eli.dashboard.refresh(); }
                  catch (e) { }
                }).catch(function (e) {
                  _ewarn("[boot] preload tier failed:", e && e.message);
                });
              }
            } catch (e) { _ewarn("[boot] preload kick failed:", e && e.message); }
            var _userS = {};
            try {
              var _raw = window.eli.compat && window.eli.compat.lsGet("eli_user_settings");
              _userS = _raw ? JSON.parse(_raw) : {};
            } catch (e) { _userS = {}; }
            if (_userS.autoCheckTools === false) {
              window.eli.log.event("boot", "auto_check_tools_skipped", { reason: "user_setting" });
              return null;
            }
            return window.eli.tools.syncFromManifest({ silent: true, force: true });
          }).then(function (sync) {
            if (sync && sync.installed > 0) {
              _elog("[ELI v3] auto-installed", sync.installed, "missing tools");
              try { if (window.eli.dashboard && window.eli.dashboard.refresh) window.eli.dashboard.refresh(); }
              catch (e) { }
              return window.eli.tools.loadBootTier().then(function () {
                if (window.eli.dashboard && window.eli.dashboard.refresh) window.eli.dashboard.refresh();
              });
            }
          }).then(function () {
            if (!window.eli.tools.retryPendingAfterKernelUpgrade) return;
            return window.eli.tools.retryPendingAfterKernelUpgrade()
              .then(function (newlyInstalled) {
                if (newlyInstalled > 0) {
                  try { if (window.eli.dashboard && window.eli.dashboard.refresh) window.eli.dashboard.refresh(); }
                  catch (e) { }
                }
                return window.eli.tools.pendingKernelUpgrades();
              })
              .then(function (pending) {
                if (pending && pending.length && typeof _eliShowKernelUpdateBanner === "function") {
                  _eliShowKernelUpdateBanner(pending);
                }
              })
              .catch(function (e) {
                _ewarn("[boot] kernel-pending scan failed:", e && e.message);
              });
          }).then(function () {
            if (window._eli3_bootDialogShown) return;
            var _userSet = {};
            try {
              var _r = window.eli.compat && window.eli.compat.lsGet("eli_user_settings");
              _userSet = _r ? JSON.parse(_r) : {};
            } catch (e) { _userSet = {}; }
            if (_userSet.autoCheckTools === false) return;
            if (!window.eli.tools || typeof window.eli.tools.updateAvailable !== "function") return;
            return window.eli.tools.updateAvailable().then(function (avail) {
              var pending = (avail || [])
                .filter(function (a) { return a.action === "update" || a.action === "install"; })
                .map(function (a) { return { entry: a.remote, local: a.local }; });
              if (!pending.length) return;
              window._eli3_bootDialogShown = true;
              if (window.eli.dashboard && window.eli.dashboard.showDownloadsDialog) {
                try { window.eli.dashboard.showDownloadsDialog({ updates: pending }); }
                catch (e) { _ewarn("[boot-update-safety] open failed:", e && e.message); }
              }
            }).catch(function () { });
          }).then(function () {
            try { if (window.eli.bus) window.eli.bus.emit("boot:complete"); }
            catch (e) { _ewarn("[boot] boot:complete emit failed:", e); }

            if (window.eli.host && window.eli.host.detectAgreementType) {
              window.eli.host.detectAgreementType().then(function (t) {
                if (t && t !== "Other") {
                  window._eliDocType = t;
                  try { if (window.eli.bus) window.eli.bus.emit("doctype:detected", { type: t }); }
                  catch (e) { }
                  try { if (window.eli.dashboard && window.eli.dashboard.refresh) window.eli.dashboard.refresh(); }
                  catch (e) { }
                }
              }).catch(function () { });
            }
          }).catch(function (err) {
            _eerror("[ELI v3] boot-tier / sync failed:", err && err.message);
          });
          var diag = window.eli.diag.selfTest();
          _elog("[ELI v3] self-test: " + diag.passed + "/" + diag.total + " passed");
          if (!diag.ok) {
            _eerror("[ELI v3] self-test failures:", diag.failed);
          }
          window.eli.perf.mark("boot:first_paint");
          var bootMs = window.eli.perf.measure("boot:office_ready", "boot:first_paint");
          if (!diag.ok) {
            var failMsg = "ELI Kernel v3 · self-test " + diag.passed + "/" + diag.total + " · check console";
            _eliPhase1Banner(failMsg, true);
          } else {
            try {
              window.eli.dashboard.render();
            } catch (e) {
              _eerror("[ELI v3] dashboard render failed:", e);
              _eliPhase1Banner("Dashboard render failed: " + (e.message || e), true);
            }
            try {
              if (window.eli.ui && window.eli.ui.adjustZoom) window.eli.ui.adjustZoom("auto");
            } catch (e) { }
          }
          window.eli.perf.checkBudget("boot:first_paint");
          window.eli.perf.mark("boot:interactive");
          window.eli.perf.checkBudget("boot:interactive");
        })
        .catch(function (err) {
          _eerror("[ELI v3] IDB open failed:", err);
          _eliPhase1Banner("ELI v3 boot — IDB FAILED: " + (err && err.message || err), true);
        });
    }


    if (typeof Office !== "undefined") {
      Office.onReady(function (info) {
        if (document.readyState === "complete" || document.readyState === "interactive") {
          init();
        } else {
          document.addEventListener("DOMContentLoaded", init);
        }
      });
    } else {
      _eerror("Office.js not loaded — running init() in browser-only mode for Phase 1 sanity check");
      if (document.readyState === "complete" || document.readyState === "interactive") {
        init();
      } else {
        document.addEventListener("DOMContentLoaded", init);
      }
    }


    window.eli.debug = function (on) {
      if (arguments.length === 0) return ELI_DEBUG;
      ELI_DEBUG = !!on;
      try {
        if (ELI_DEBUG) localStorage.setItem("eli_debug", "1");
        else localStorage.removeItem("eli_debug");
      } catch (e) { }
      return ELI_DEBUG;
    };


    if (window.eli && window.eli.settings && typeof window.eli.settings.register
    === "function") {
      window.eli.settings.register("debug_mode", {
        default: false,
        type: "boolean",
        storage: { type: "ls_key", key: "eli_debug" },
        apply: function (val) {
          ELI_DEBUG = !!val;
        },
        adminPushable: true,
        describe: "Verbose kernel + tool logging (eli.log.event + perf budgets)",
      });

      window.eli.settings.register("user_id", {
        default: null,
        type: "string",
        storage: { type: "ls_key", key: "eli_user_id" },
        adminPushable: false,
        describe: "Anonymous install ID used by fleet telemetry",
      });
      function _ensureUserIdImpl() {
        try {
          function _bestInitials() {
            var initials = "XX";
            try {
              var ident = (window.eli.tools && typeof window.eli.tools.userIdentity === "function")
                ? window.eli.tools.userIdentity()
                : null;
              var first = (ident && ident.firstName) ? String(ident.firstName).trim() : "";
              var last = (ident && ident.name)
                ? String(ident.name).trim().split(/\s+/).slice(-1)[0]
                : "";
              if (!first && ident && ident.email) {
                var local = String(ident.email).split("@")[0] || "";
                var parts = local.split(/[._-]/);
                first = parts[0] || "";
                last = parts[parts.length - 1] || "";
              }
              function _firstAlpha(s) {
                var mm = /[A-Za-z]/.exec(String(s || ""));
                return mm ? mm[0].toUpperCase() : "";
              }
              var fi = _firstAlpha(first);
              var li = _firstAlpha(last);
              if (/^[A-Z]$/.test(fi) && /^[A-Z]$/.test(li)) initials = fi + li;
              else if (/^[A-Z]$/.test(fi)) initials = fi + "X";
            } catch (_e) { }
            return initials;
          }

          var existing = window.eli.settings.get("user_id");
          if (existing && /^[A-Z][A-Z]-[a-z0-9]{8}$/.test(existing)) {
            var currentPrefix = existing.slice(0, 2);
            var betterInitials = _bestInitials();
            if (currentPrefix !== betterInitials &&
              (currentPrefix === "XX" || (currentPrefix.charAt(1) === "X" && betterInitials.charAt(1) !== "X")) &&
              betterInitials !== "XX") {
              var preserved = existing.slice(3);
              var upgraded = betterInitials + "-" + preserved;
              window.eli.settings.set("user_id", upgraded, { layer: "user" });
              window.eli.log.event("boot", "user_id_upgraded", { from: existing, to: upgraded });
            }
            return;
          }

          var initials = _bestInitials();
          if (initials === "XX") {
            window.eli.log.event("boot", "user_id_deferred_no_identity", {});
            return;
          }
          var rand = "";
          var alph = "abcdefghijklmnopqrstuvwxyz0123456789";
          for (var i = 0; i < 8; i++) rand += alph.charAt(Math.floor(Math.random() * alph.length));
          var newId = initials + "-" + rand;
          window.eli.settings.set("user_id", newId, { layer: "user" });
          window.eli.log.event("boot", "user_id_generated", { id: newId });
        } catch (_e) { }
      }
      if (window.eli.tools) window.eli.tools.ensureUserId = _ensureUserIdImpl;
      _ensureUserIdImpl();
    }

