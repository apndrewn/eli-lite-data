                  var entry = ((res && res.updates) || [])
                    .map(function (u) { return u.entry || u.remote; })
                    .filter(function (e) { return e && e.id === id; })[0];
                  if (!entry) {
                    return window.eli.tools.list().then(function (installed) {
                      if ((installed || []).some(function (t) { return t.id === id; })) {
                        if (ov.parentNode) ov.parentNode.removeChild(ov);
                        resolve(true); return;
                      }
                      if (typeof showToast === "function") showToast(label + " not in CDN manifest.", "err");
                      if (btn) { btn.disabled = false; btn.textContent = "Install Now"; }
                      resolve(false);
                    });
                  }
                  return window.eli.tools.downloadToolBundle(entry).then(function () {
                    if (typeof showToast === "function") showToast("📦 Installed " + label, "ok");
                    if (ov.parentNode) ov.parentNode.removeChild(ov);
