      }

      function _showUpdateSummary(result) {
        if (!result) return;
        var installed = result.installed || [];
        var updated = result.updated || [];
        var failed = result.failed || [];
        if (!installed.length && !updated.length && !failed.length) {
          if (typeof showToast === "function") showToast("No changes applied.", "info");
          return;
        }
        var totalOk = installed.length + updated.length;
        function _split(arr) {
          var tools = [], data = [];
          (arr || []).forEach(function (x) {
            var it = typeof x === "string" ? { label: x, kind: "tool" } : x;
            (it.kind === "data" ? data : tools).push(it.label);
          });
          return { tools: tools.sort(), data: data.sort() };
        }
        function _items(s) {
          var out = [];
          if (s.tools.length) out.push("<b>Tools:</b> " + s.tools.join(", "));
          if (s.data.length) out.push("<b>Libraries:</b> " + s.data.join(", "));
          return out;
        }
        var bullets = [];
        if (installed.length) bullets.push({ heading: "📦 Installed (" + installed.length + ")", items: _items(_split(installed)) });
        if (updated.length) bullets.push({ heading: "⬆️ Updated (" + updated.length + ")", items: _items(_split(updated)) });
        if (failed.length) bullets.push({ heading: "⚠️ Failed (" + failed.length + ")", items: _items(_split(failed)) });
        var allOk = !failed.length;
        showEliDialog({
          variant: allOk ? "neutral" : (totalOk ? "warning" : "danger"),
          tier: "premium",
          dialogClass: "_eli3_dialog_summary",
          icon: allOk ? "✨" : (totalOk ? "⚠️" : "❌"),
          title: allOk ? "Updates applied" : (totalOk ? "Updates partially applied" : "Updates failed"),
          bullets: bullets,
          secondary: { label: "OK" },
        });
      }

      function _shortTs(iso) {
        if (!iso) return null;
        var d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        var hours = d.getHours();
        var ampm = hours >= 12 ? "pm" : "am";
        hours = hours % 12 || 12;
        var mins = ("0" + d.getMinutes()).slice(-2);
        return months[d.getMonth()] + " " + d.getDate() + " - " + hours + ":" + mins + ampm;
      }
      function _verLabel(obj) {
        if (!obj) return null;
        if (obj.__version) return obj.__version;
        if (obj.version) return obj.version;
        return _shortTs(obj.releasedAt) || _shortTs(obj.lastUpdated) || null;
      }

      function _showUpdateDialog(syncResult) {
        try {
          Array.prototype.forEach.call(
            document.querySelectorAll(".eli-overlay"),
            function (ov) {
              if (ov.querySelector("._eli3_dialog_downloads, ._eli3_dialog_uptodate")) {
                if (ov.parentNode) ov.parentNode.removeChild(ov);
              }
            }
          );
        } catch (e) { }
        var updates = (syncResult && syncResult.updates) || _pendingUpdates || [];
        var user = (window.eli.tools && window.eli.tools.userIdentity)
          ? window.eli.tools.userIdentity() : {};
        var email = (user && user.email) || "";
        var title = email ? "Downloads · " + email : "Available Downloads";

        if (!updates.length) {
          var lastSeen = "just now";
          showEliDialog({
            variant: "neutral",
            tier: "premium",
            dialogClass: "_eli3_dialog_uptodate",
            icon: "✨",
            title: "All tools and libraries up to date",
            paragraphs: [
              "You have the latest version of every installed tool and library.",
