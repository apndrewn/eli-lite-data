          try { existing = existingRaw ? JSON.parse(existingRaw) : {}; } catch (e) { existing = {}; }
          var curName = String(existing.userName || "");
          var curEmail = String(existing.userEmail || officeEmail || "");
          var curLang = String(window.eli.compat.lsGet("eli_language") || "en");
          var curGroup = String(existing.userGroup || "External Innovation");

          var groups = ["External Innovation", "Commercial", "Litigation", "Patents", "Other"];
          var langs = [
            { v: "en", l: "English" }, { v: "es", l: "Español" }, { v: "fr", l: "Français" },
            { v: "de", l: "Deutsch" }, { v: "it", l: "Italiano" }, { v: "pt", l: "Português" },
            { v: "zh", l: "中文" }, { v: "ja", l: "日本語" }, { v: "ru", l: "Русский" },
          ];
          function _esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
          var langOpts = langs.map(function (l) {
            return '<option value="' + l.v + '"' + (l.v === curLang ? " selected" : "") + ">" + l.l + "</option>";
          }).join("");
          var groupOpts = groups.map(function (g) {
            return '<option value="' + _esc(g) + '"' + (g === curGroup ? " selected" : "") + ">" + _esc(g) + "</option>";
          }).join("");
          var body =
            '<div class="_eli3_profile_hero">' +
            '<div class="_eli3_profile_hero_eyebrow">STEP 2 OF 2</div>' +
            '<div class="_eli3_profile_hero_title">Tell us about you</div>' +
            '<div class="_eli3_profile_hero_desc">' +
            'A few quick details so ELI knows who you are. You can change these any time in Settings.' +
            '</div>' +
            '</div>' +
            '<div class="_eli3_profile_form">' +
            '<div class="_eli3_profile_field">' +
            '<label for="_eli3_ob_name" class="_eli3_profile_label">Full Name</label>' +
            '<input id="_eli3_ob_name" class="_eli3_profile_input" type="text" value="' + _esc(curName) + '" placeholder="e.g. Andrew Nemiroff">' +
            '</div>' +
            '<div class="_eli3_profile_field">' +
            '<label for="_eli3_ob_email" class="_eli3_profile_label">Email</label>' +
            '<input id="_eli3_ob_email" class="_eli3_profile_input" type="email" value="' + _esc(curEmail) + '" placeholder="you@company.com">' +
            '</div>' +
            '<div class="_eli3_profile_row">' +
            '<div class="_eli3_profile_field">' +
            '<label for="_eli3_ob_lang" class="_eli3_profile_label">Language</label>' +
