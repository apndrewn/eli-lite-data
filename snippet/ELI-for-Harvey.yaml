            '<a href="javascript:void(0)" data-eli-dl-all="' + _esc(group) + '">All</a>' +
            '<a href="javascript:void(0)" data-eli-dl-none="' + _esc(group) + '">None</a>' +
            '</span>';
        }

        function _renderSection(opts) {
          var groups = Array.isArray(opts.groups) ? opts.groups : null;
          var rows = opts.rows || [];
          var totalCount = groups
            ? groups.reduce(function (n, g) { return n + ((g && g.rows) || []).length; }, 0)
            : rows.length;
          if (!totalCount) return "";
          var collapsed = !!opts.collapsed;
          var key = opts.key;
          var chev = collapsed ? "▸" : "▾";
          var bodyStyle = collapsed ? ' style="display:none;"' : "";
          var listHtml = groups
            ? groups.map(function (g) {
