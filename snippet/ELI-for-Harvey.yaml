      function _esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      function _renderUpdateDialog(updates, title, manifest) {
        function _hasInstalled(u) { return !!_verLabel(u && u.local); }

        function _isRestricted(entry) {
          if (!entry) return false;
          if (Array.isArray(entry.audienceEmails) && entry.audienceEmails.length) return true;
          if (Array.isArray(entry.audienceEmailDomains) && entry.audienceEmailDomains.length) return true;
          var aud = Array.isArray(entry.audience) ? entry.audience : null;
          if (aud && aud.length && aud.indexOf("all") === -1) return true;
          return false;
        }

        function _row(u) {
          var entry = u.entry || u.remote || {};
          var local = u.local || {};
          var lv = _verLabel(local);
          var rv = _verLabel(entry) || "?";
          var label = entry.label || entry.id;
          var icon = (entry.catalog && entry.catalog.icon) || (entry.kind === "data" ? "📚" : "🧩");
          var versions = lv
            ? '<span class="_eli3_dl_v_old">' + _esc(lv) + '</span>' +
            '<span class="_eli3_dl_v_arrow">→</span>' +
            '<span class="_eli3_dl_v_new">' + _esc(rv) + '</span>'
            : '<span class="_eli3_dl_v_new">' + _esc(rv) + '</span>';
          var status = _hasInstalled(u) ? "Update" : "Install";
          var restricted = _isRestricted(entry)
            ? '<span class="_eli3_dl_restricted" title="Restricted — limited audience allow-list">🔒 Restricted</span>'
            : "";
          return '<label class="_eli3_dl_row">' +
            '<input type="checkbox" data-eli-upd-id="' + _esc(entry.id || "") + '" checked>' +
            '<span class="_eli3_dl_icon">' + _esc(icon) + '</span>' +
            '<span class="_eli3_dl_label">' +
            '<span class="eli3_dl_name">' + _esc(label) + '</span>' +
            '<span class="_eli3_dl_status">' + status + '</span>' +
            restricted +
            '</span>' +
            '<span class="_eli3_dl_versions">' + versions + '</span>' +
            '</label>';
        }

        var bundleByMember = {};
        var bundleOrder = [];
        var bundleMeta = {};
        var allBundles = (manifest && Array.isArray(manifest.bundles)) ? manifest.bundles : [];
        allBundles.forEach(function (b) {
          if (!b || !b.id || !Array.isArray(b.members)) return;
          bundleOrder.push(b.id);
          bundleMeta[b.id] = b;
          b.members.forEach(function (mid) {
            if (!bundleByMember[mid]) bundleByMember[mid] = b.id;
