      function _launchInstalledTool(opts) {
        opts = opts || {};
        var id = opts.id;
        var label = opts.label || id;
        var icon = opts.icon || "🧩";
        var fnName = opts.fnName;
        var args = opts.args || [];
        function _runIfReady() {
          var fn = window[fnName];
          if (typeof fn !== "function") {
            if (typeof showToast === "function") {
              showToast(label + " is installed but still loading. Try again in a moment.", "warn");
            }
            return;
          }
          try { fn.apply(null, args); }
          catch (err) {
            _eerror("[v3] " + fnName + " threw:", err);
            if (typeof showToast === "function") {
              showToast(label + " error: " + (err && err.message || "unknown") +
                " — this tool may need an update.", "err");
            }
          }
        }
        var listFn = window.eli && window.eli.tools && window.eli.tools.list;
        if (typeof listFn !== "function") { _runIfReady(); return; }
        listFn().then(function (installed) {
          var bundle = (installed || []).filter(function (t) { return t && t.id === id; })[0];
          if (!bundle) {
            _promptInstallTool({ id: id, label: label, icon: icon })
              .then(function (didInstall) { if (didInstall) _runIfReady(); });
            return;
          }
          var isV3 = !!(bundle.engine || bundle.view || (bundle.advertises && bundle.advertises.tile));
          if (!isV3) {
            _promptUnmigrated({ id: id, label: label, icon: icon });
            return;
          }
          _runIfReady();
        }).catch(function () { _runIfReady(); });
      }

      function _promptUnmigrated(opts) {
        opts = opts || {};
        var label = opts.label || opts.id;
        showEliDialog({
          variant: "info",
          tier: "premium",
          icon: opts.icon || "🧩",
          title: label + " — being migrated",
          paragraphs: [
            "<b>" + label + "</b> is a v2-format tool that hasn't been migrated to v3 yet, " +
            "so launching it would break the dashboard layout.",
            "For now, use <b>Check for Updates</b> to install, update, or remove tools — " +
            "that surface is fully v3-native.",
          ],
          primary: {
            label: "Open Check for Updates",
            onclick: function () {
              if (window.eli.tools && window.eli.tools.syncFromManifest) {
                window.eli.tools.syncFromManifest({ force: true })
