      var _pendingUpdates = [];
      function _refreshUpdateButton() {
        var n = _pendingUpdates.length;
        var anchors = [
          { el: document.getElementById("btnHeaderSettings"), badgeId: "_eli3_update_badge", inline: false },
          { el: document.getElementById("_eli3_help_check_btn"), badgeId: "_eli3_update_badge_help", inline: true },
        ];
        var extras = document.querySelectorAll("[data-eli-update-badge]");
        Array.prototype.forEach.call(extras, function (el, idx) {
          var modeAttr = el.getAttribute("data-eli-update-badge");
          var inline = modeAttr === "inline" || modeAttr === "";
          var badgeId = el.getAttribute("data-eli-badge-id") || ("_eli3_update_badge_x" + idx);
          if (!el.getAttribute("data-eli-badge-id")) el.setAttribute("data-eli-badge-id", badgeId);
          anchors.push({ el: el, badgeId: badgeId, inline: inline });
        });
        anchors = anchors.filter(function (a) { return !!a.el; });
        anchors.forEach(function (a) {
          var existing = document.getElementById(a.badgeId);
          if (!n) {
            if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
            return;
          }
          if (!existing) {
            existing = document.createElement("span");
            existing.className = "_eli3_update_badge" + (a.inline ? " _eli3_update_badge_inline" : "");
            existing.id = a.badgeId;
