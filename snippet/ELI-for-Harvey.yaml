                    }
                  });
              }
            },
          },
          secondary: { label: "Close" },
        });
      }

      function _promptInstallTool(opts) {
        opts = opts || {};
        var id = opts.id;
        var label = opts.label || id;
        return new Promise(function (resolve) {
          showEliDialog({
            variant: "info",
            tier: "premium",
            icon: opts.icon || "🧩",
            title: label + " not installed",
            paragraphs: [
              "<b>" + label + "</b> isn't installed on this device yet.",
              "Install it from the CDN to use it now, or open <b>Check for Updates</b> later.",
            ],
            primary: {
              label: "Install Now",
              onclick: function (e, ov) {
                var btn = e && e.currentTarget;
                if (btn) { btn.disabled = true; btn.textContent = "Installing…"; }
