        if (!_cachedSelfTest) _cachedSelfTest = window.eli.diag.selfTest();

        if (window.eli.tools && typeof window.eli.tools.updateAvailable === "function") {
          window.eli.tools.updateAvailable().then(function (avail) {
            var pending = (avail || [])
              .filter(function (a) { return a.action === "update" || a.action === "install"; })
              .map(function (a) { return { entry: a.remote, local: a.local }; });
            _pendingUpdates = pending;
